[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[project]
name = "properties-analytics"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.24",
    "scrapy>=2.11",
    "google-cloud-bigquery>=3.17",
    "prefect>=2.16",
]