[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[project]
name = "properties-analytics"
version = "0.1.0"
description = "Comprehensive real estate analytics platform with scraping, data processing, and visualization capabilities"
authors = [
    {name = "Property Analytics Team", email = "analytics@properties.com"}
]
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
keywords = ["real-estate", "analytics", "scraping", "data-science", "property"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Investment",
    "Topic :: Scientific/Engineering :: Information Analysis",
]

# Core dependencies - using requirements.txt for full dependency management
dependencies = [
    "pandas>=2.2.0",
    "numpy>=1.24.0",
    "scrapy>=2.8.0",
    "requests>=2.28.0",
    "python-dotenv>=0.19.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.2.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
    "isort>=5.12.0",
    "mypy>=1.0.0",
    "jupyterlab>=3.6.0",
    "notebook>=6.5.0",
    "ipykernel>=6.21.0",
]

airflow = [
    "apache-airflow>=2.5.0",
    "apache-airflow-providers-google>=10.0.0",
    "apache-airflow-providers-postgres>=5.4.0",
    "apache-airflow-providers-slack>=7.3.0",
    "celery>=5.2.0",
    "redis>=4.3.0",
]

gcp = [
    "google-cloud-storage>=2.7.0",
    "google-cloud-bigquery>=3.4.0",
    "google-auth>=2.16.0",
]

dbt = [
    "dbt-core>=1.4.0",
    "dbt-bigquery>=1.4.0",
]

viz = [
    "matplotlib>=3.5.0",
    "seaborn>=0.11.0",
    "plotly>=5.13.0",
    "streamlit>=1.17.0",
]

scraping = [
    "selenium>=4.8.0",
    "beautifulsoup4>=4.11.0",
    "scrapy-rotating-proxies>=0.6.0",
    "scrapy-user-agents>=0.1.0",
    "fake-useragent>=1.1.0",
]

all = [
    "properties-analytics[dev,airflow,gcp,dbt,viz,scraping]"
]

[project.urls]
Homepage = "https://github.com/your-org/properties-analytics"
Documentation = "https://properties-analytics.readthedocs.io/"
Repository = "https://github.com/your-org/properties-analytics.git"
Issues = "https://github.com/your-org/properties-analytics/issues"

[tool.black]
line-length = 88
target-version = ['py311']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 88
known_first_party = ["properties_analytics"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "--cov=src --cov-report=html --cov-report=term-missing"

[tool.coverage.run]
source = ["src"]
omit = [
    "*/tests/*",
    "*/venv/*",
    "*/.venv/*",
    "*/site-packages/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
] 